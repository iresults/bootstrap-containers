<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:bootstrapContainers="http://typo3.org/ns/Iresults/BootstrapContainers/ViewHelpers">

<f:section name="TabHeader">
    
    <input type="radio" class="btn-check" role="tab" name="btnradio" autocomplete="off">
    <label class="btn btn-outline-primary {f:if(condition:active, then:'active')}" for="uid-{children.0.uid}-tab" id="uid-{children.0.uid}-tab" data-bs-toggle="tab" data-bs-target="#uid-{children.0.uid}-tab-pane" aria-controls="uid-{children.0.uid}-tab-pane" aria-selected="true">{children.0.header}</label>

</f:section>

<f:section name="Tab">
    <div class="tab-pane fade  {f:if(condition:active, then:'show active')}" id="uid-{children.0.uid}-tab-pane" role="tabpanel" aria-labelledby="uid-{children.0.uid}-tab" tabindex="0">
        <f:if condition="{children}">
            <div class=" grid-col">
                <f:for each="{children}" as="element">
                    {element.renderedContent -> f:format.raw()}
                </f:for>
            </div>
        </f:if>   
    </div>
</f:section>
</html>
